[package]
name = "doaor-workspace"
version = "0.1.0"
edition = "2021"
description = "A calm desktop interface for natural computer actions"

[lib]
name = "doaor_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
base64 = "0.22"
url = "2"

[dev-dependencies]
tempfile = "3"
